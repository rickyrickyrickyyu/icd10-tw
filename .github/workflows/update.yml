name: update
# 每週自動更新（週二 05:00 台北）。
#   1. 比對健保署 6 個 CSV 的 sha（官方「不定期更新」，比 sha 不比日期）
#   2. 詞彙層（CDC/CMS/DOID/MeSH/國教院/Wikidata）每月第一週才重抓 —— 用 actions/cache
#      以「年-月」為 key，同一個月內沿用，免得每週因 Wikidata 小編輯就改版一次
#   3. 有變 → 完整 pipeline（閘門＋搜尋回歸）→ commit → Release（附離線包）
#   4. 不管有沒有變都重新部署，並把 checked_at 注入 dist 的 meta.json：
#      網站上的「最後自動檢查」停了超過 21 天 = 這個排程壞了
on:
  schedule:
    - cron: '0 21 * * 1'
  workflow_dispatch:
    inputs:
      override_gate:
        description: '人工確認後放行的 gate 編號，逗號分隔（例 2,11）'
        type: string
        default: ''
      force:
        description: '不管 sha 有沒有變都重建（含詞彙層）'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  actions: write   # keepalive 用

concurrency:
  group: icd-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ★ runner（Ubuntu 24.04）的系統 Python 是 externally-managed，`uv pip install --system`
      #   會被拒（首次上線那次 update 就死在這一步）。先用 setup-python 裝一個自己的。
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false   # v7 預設開快取，找不到 requirements 檔會一直警告；只裝兩個套件不需要
      - name: Python 依賴
        run: uv pip install --system pyyaml

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 月份 key
        id: month
        run: |
          echo "ym=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "early=$([[ $(date +%-d) -le 7 ]] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      # ★ GitHub 會逐出 7 天沒被存取的快取，每週排程剛好卡在邊界（2026-10 的快取 10-27 被逐出 → 月中重抓
      #   Wikidata → 詞彙漂移讓搜尋回歸變紅）。restore-keys 退回上個月的快取；只有「每月前 7 天」或「完全沒快取」
      #   才重抓，跟 bin/pipeline.sh 的本機規則一致。
      - name: 詞彙層快取（同月沿用）
        id: vocab
        uses: actions/cache/restore@v5
        with:
          path: data/raw/vocab
          key: vocab-${{ steps.month.outputs.ym }}
          restore-keys: vocab-

      # ★ 只下載一次：這一步就把 6 個 CSV 存進 data/raw 並比 sha，後面 pipeline 用 rebuild（不再下載）。
      # ★ 健保署伺服器會間歇性 reset GitHub runner 的連線（curl 56）。連不上時「不更新資料、照常部署現有版本、
      #   不注入 checked_at」—— 網站上的最後檢查日停住，超過 21 天自然會警告；不要每週都把 job 弄紅。
      # ★ shell: bash 才有 pipefail；預設 bash -e 下 `| tee` 會吃掉 python 的失敗碼（第二次實測就這樣誤判成功）。
      - name: 下載健保資料並判斷有沒有變
        id: check
        continue-on-error: true
        shell: bash
        run: |
          # ★ 暫存檔寫到 $RUNNER_TEMP：放在 repo 根目錄會被 pre_push_check 當成「不屬於資料管線的檔案」擋下 commit
          python3 etl/fetch_csv.py | tee "$RUNNER_TEMP/check.log"
          echo "changed=$(grep -o 'CHANGED=[01]' "$RUNNER_TEMP/check.log" | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: 詞彙層（快取沒命中或強制才重抓）
        id: vocabfetch
        if: >-
          steps.check.outputs.ok == '1' && (inputs.force || steps.vocab.outputs.cache-matched-key == '' ||
          (steps.vocab.outputs.cache-hit != 'true' && steps.month.outputs.early == '1'))
        run: python3 etl/fetch_vocab.py

      # 立刻存快取，不等整個 job 成功（actions/cache 的 post-save 在後面步驟失敗時不會存，下次又得重抓 CDC）
      - name: 存詞彙層快取
        if: steps.vocabfetch.outcome == 'success' && steps.vocab.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: data/raw/vocab
          key: vocab-${{ steps.month.outputs.ym }}

      - name: 重大傷病對照表頁面檢查（Playwright；WAF 擋 curl）
        id: catas
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium >/dev/null
          # ★ 2026-10 起健保署 WAF 對 runner 回 403：不要讓後面 json.load 噴 traceback 誤導判讀，明確標 warning
          if ! PW_CHANNEL=chromium node bin/fetch_catastrophic.mjs --check > "$RUNNER_TEMP/catas.json"; then
            echo "::warning::重大傷病頁面抓不到（多半是 WAF 403），本週略過；本機 make catas 可檢查"
            echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CUR=$(python3 -c "import yaml;print(yaml.safe_load(open('curation/catastrophic.yaml'))['version'])")
          NEW=$(python3 -c "import json,re;t=json.load(open('$RUNNER_TEMP/catas.json'))['title'];m=re.search(r'\((\d{3}\.\d{1,2}\.\d{1,2})更新\)',t);print(m.group(1) if m else '')")
          echo "cur=$CUR new=$NEW"
          [[ -n "$NEW" && "$NEW" != "$CUR" ]] && echo "changed=1" >> "$GITHUB_OUTPUT" || echo "changed=0" >> "$GITHUB_OUTPUT"

      - name: 完整 pipeline（有變才跑）
        id: pipe
        if: steps.check.outputs.ok == '1' && (steps.check.outputs.changed == '1' || steps.vocabfetch.outcome == 'success' || inputs.force)
        env:
          OVERRIDE: ${{ inputs.override_gate }}
        run: |
          bash bin/pipeline.sh rebuild
          echo "ran=1" >> "$GITHUB_OUTPUT"

      - name: 保留 staging 供人工檢視
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: staging-${{ github.run_id }}
          path: data/build/.staging
          # ★ .staging 是隱藏目錄，upload-artifact v4.4+ 預設排除 → 之前三次失敗都沒留下 artifact
          include-hidden-files: true
          if-no-files-found: ignore

      - name: commit（只收資料管線路徑）
        id: commit
        if: steps.pipe.outputs.ran == '1'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 bin/pre_push_check.py
          git add public/data snapshots offline/MANIFEST.txt tests/bench/bench_history.jsonl
          if git diff --cached --quiet; then
            echo "無變更"; echo "new=0" >> "$GITHUB_OUTPUT"
          else
            FP=$(python3 -c "import json;print(json.load(open('public/data/meta.json'))['data_fingerprint'])")
            git commit -m "chore(data): $(date +%F) 資料更新（指紋 ${FP}）"
            git push
            echo "new=1" >> "$GITHUB_OUTPUT"
            echo "fp=${FP}" >> "$GITHUB_OUTPUT"
          fi

      - name: 發 Release（附離線包）
        if: steps.commit.outputs.new == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-$(date +%Y%m%d)"
          gh release create "$TAG" offline/*.zip offline/READ-ME-FIRST.txt \
            --title "資料更新 $(date +%F)" \
            --notes "資料指紋 ${{ steps.commit.outputs.fp }}。離線版：下載 zip、解壓後雙擊 html。" || true

      # ★ GITHUB_TOKEN 的 push 不會觸發其他 workflow，所以 build+deploy 必須在這裡做
      - name: 建置網站並注入 checked_at（只有真的檢查成功才注入）
        env:
          CHECKED: ${{ steps.check.outputs.ok }}
        run: |
          pnpm build
          [[ "$CHECKED" == "1" ]] || { echo "健保署連不上，沿用上次 checked_at"; exit 0; }
          python3 - <<'PY'
          import json, datetime, pathlib
          p = pathlib.Path('dist/data/meta.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          m['checked_at'] = datetime.date.today().isoformat()
          p.write_text(json.dumps(m, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: 重大傷病對照表有新版 → 開 issue（人工下載核對，不自動套用）
        if: steps.catas.outputs.changed == '1'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
              title: '重大傷病對照表有新版',
              body: '健保署頁面上的對照表版本與 curation/catastrophic.yaml 不同。\n本機執行 `make catas` 下載、更新 yaml 的 file/sha256/version 與類別名稱後 `make rebuild`。' });

      - name: 健保署連不上 → 開 issue（已有未關閉的同名 issue 就不重複開）
        if: steps.check.outputs.ok != '1'
        uses: actions/github-script@v8
        with:
          script: |
            const title = '健保署資料暫時抓不到（GitHub runner 連線被 reset）';
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            if (open.data.some((i) => i.title === title)) return;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title,
              body: `本週自動檢查下載失敗，網站維持上一版（未注入 checked_at，超過 21 天網站會警告）。\n通常下週會自己恢復；急用可在本機跑 \`icd update\`（台灣 IP 直連健保署）。\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

      # 已有未關閉的失敗 issue → 留言追加，不重複開（2026-10/11 連開三張同樣的）；附上新失分題
      - name: 失敗時開 issue
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const f = `${process.env.RUNNER_TEMP}/bench_regress.txt`;
            const detail = fs.existsSync(f) ? `\n\n\`\`\`\n${fs.readFileSync(f, 'utf8')}\n\`\`\`` : '';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `閘門、搜尋回歸或抓取失敗；正式資料未被修改（fail-closed），網站維持上一版。\n若是 gate 1（表頭契約）失敗，健保署可能已轉版到新年度 ICD，需要人工處理。\n搜尋回歸多半是月初重抓的詞彙層（Wikidata）漂移：看下方新失分題，策展修正後 make rebuild && make verify。${detail}\n\nRun: ${run}`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const prev = open.data.find((i) => i.title.endsWith('自動更新失敗'));
            if (prev) await github.rest.issues.createComment({ owner, repo, issue_number: prev.number, body: `${new Date().toISOString().slice(0,10)} 再次失敗\n\n${body}` });
            else await github.rest.issues.create({ owner, repo, title: `❌ ${new Date().toISOString().slice(0,10)} 自動更新失敗`, body });

      # ★ 公開 repo 連續 60 天沒有 commit，GitHub 會靜默停用排程（資料沒變就不 commit，09-21→11-03 已隔 43 天）。
      #   每次排程跑完都呼叫一次 enable 重置計時（keepalive-workflow 的 API 模式同原理），失敗只警告。
      - name: 防排程因 60 天無活動被停用
        if: always()   # 手動觸發也跑：重複 enable 無副作用，且每次都驗得到這步沒壞
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || echo "::warning::keepalive 失敗"

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
