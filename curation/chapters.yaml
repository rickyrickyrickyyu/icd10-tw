# ICD-10-CM 2023 的 22 章（範圍與 CDC Tabular 一致，build_hierarchy 會逐章核對）。
# 中文章名依健保署中文版 ICD-10-CM 章名用語；由 Claude 依常用譯名草擬，M116 RickyYu 2026-09-11 核可。
reviewed: true
cm:
  - {n: 1,  range: [A00, B99], zh: 某些傳染病及寄生蟲病}
  - {n: 2,  range: [C00, D49], zh: 腫瘤}
  - {n: 3,  range: [D50, D89], zh: 血液及造血器官疾病與涉及免疫機轉之疾患}
  - {n: 4,  range: [E00, E89], zh: 內分泌、營養及代謝疾病}
  - {n: 5,  range: [F01, F99], zh: 精神、行為及神經發展疾患}
  - {n: 6,  range: [G00, G99], zh: 神經系統疾病}
  - {n: 7,  range: [H00, H59], zh: 眼睛及附屬器官疾病}
  - {n: 8,  range: [H60, H95], zh: 耳及乳突疾病}
  - {n: 9,  range: [I00, I99], zh: 循環系統疾病}
  - {n: 10, range: [J00, J99], zh: 呼吸系統疾病}
  - {n: 11, range: [K00, K95], zh: 消化系統疾病}
  - {n: 12, range: [L00, L99], zh: 皮膚及皮下組織疾病}
  - {n: 13, range: [M00, M99], zh: 肌肉骨骼系統及結締組織疾病}
  - {n: 14, range: [N00, N99], zh: 泌尿生殖系統疾病}
  - {n: 15, range: [O00, O9A], zh: 懷孕、生產及產褥期}
  - {n: 16, range: [P00, P96], zh: 源於周產期的特定病況}
  - {n: 17, range: [Q00, Q99], zh: 先天性畸形、變形及染色體異常}
  - {n: 18, range: [R00, R99], zh: 症狀、徵候與臨床和實驗室異常發現，他處未歸類者}
  - {n: 19, range: [S00, T88], zh: 傷害、中毒及其他特定外因造成的結果}
  - {n: 20, range: [V00, Y99], zh: 疾病及死亡的外因}
  - {n: 21, range: [Z00, Z99], zh: 影響健康狀態及與健康服務接觸之因素}
  - {n: 22, range: [U00, U85], zh: 特殊目的代碼}
# ICD-10-PCS 首碼 = Section
pcs:
  "0": 內科及外科
  "1": 產科
  "2": 放置
  "3": 給藥
  "4": 測量及監測
  "5": 體外輔助及功能替代
  "6": 體外治療
  "7": 整骨療法
  "8": 其他處置
  "9": 脊椎推拿
  "B": 影像
  "C": 核子醫學
  "D": 放射腫瘤學
  "F": 物理復健及診斷聽力學
  "G": 心理衛生
  "H": 物質濫用治療
  "X": 新技術
