# 類別名稱：逐字取自「重大傷病項目及其證明有效期限(113年9月16日發布修訂).odt」各大項標題，
# 只做機械截短（到第一個〔、，或全形括號前），不改字。
# 十四項在該檔的大項列只有「十四」兩字（無標題），名稱取其子項(一)的原文開頭。
categories:
  1: 需積極或長期治療之癌症
  2: 遺傳性凝血因子缺乏
  3: 嚴重溶血性及再生不良性貧血
  4: 慢性腎衰竭〔尿毒症〕，必須接受定期透析治療者
  5: 需終身治療之全身性自體免疫症候群
  6: 慢性精神病
  7: 先天性新陳代謝異常疾病
  8: 心、肺、胃腸、腎臟、神經、骨骼系統等之先天性畸形及染色體異常
  9: 燒燙傷面積達全身百分之二十以上；或顏面燒燙傷合併五官功能障礙者
  10: 接受器官移植
  11: 小兒麻痺、腦性麻痺所引起之神經、肌肉、骨骼、肺臟等之併發症者
  12: 重大創傷且其嚴重程度到達創傷嚴重程度分數十六分以上者
  13: 因呼吸衰竭需長期使用呼吸器
  14: 因腸道大量切除或失去功能引起之嚴重營養不良者
  15: 因潛水、或減壓不當引起之嚴重型減壓病或空氣栓塞症
  16: 重症肌無力症
  17: 先天性免疫不全症
  18: 脊髓損傷或病變所引起之神經、肌肉、皮膚、骨骼、心肺、泌尿及腸胃等之併發症者
  19: 職業病
  20: 急性腦血管疾病
  21: 多發性硬化症
  22: 先天性肌肉萎縮症
  23: 外皮之先天畸形
  24: 漢生病
  25: 肝硬化症
  26: 早產兒所引起之神經、肌肉、骨骼、心臟、肺臟等之併發症
  27: 砷及其化合物之毒性作用(烏腳病)
  28: 運動神經元疾病
  29: 庫賈氏病
  30: 罕見疾病
